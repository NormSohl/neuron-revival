# Hartmann Neuron settings. This file is on the stick's small NEURONCFG drive, so you can edit it
# from Windows (Notepad) or the Mac (TextEdit, plain text). Changes take effect at the next start.

# Real panel: "auto" connects the Neuron's panel through a USB-serial adapter if one is plugged in.
# "virtual" = on-screen panel only; or a device such as /dev/ttyS0. The on-screen panel always works too.
PANEL_DEV=auto

# Audio output: "auto" picks the first USB audio interface, else the PC's built-in audio.
# Or name an ALSA device, e.g. plughw:CARD=Device,DEV=0
ALSA_DEV=auto

# Screen: 1 = full-screen web panel on this PC's display, 0 = simple text panel.
KIOSK=1

# Engine: neuron (original, 32 voices) or neuron_v64 (64-voice pool).
ENGINE=neuron

# 1 = dedicated Neuron PC: real-time priority, two CPU cores, small (6 ms) output buffer.
DEDICATED=1
